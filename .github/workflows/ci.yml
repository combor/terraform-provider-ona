# Terraform Provider CI workflow.
name: CI

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.goreleaser.yml'
      - 'examples/**'
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.goreleaser.yml'
      - 'examples/**'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0, uses checkout@v6.0.2 + setup-go@v6.2.0
        with:
          cache: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v -o terraform-provider-ona .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  integration:
    name: Integration Test (Terraform ${{ matrix.terraform }})
    needs:
      - build
      - govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      max-parallel: 1
      matrix:
        terraform:
          - '1.7.*'
          - '1.15.*'
    env:
      GITPOD_API_KEY: ${{ secrets.GITPOD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Build provider
        run: go build -o terraform-provider-ona .
      - name: Setup dev overrides
        run: |
          cat > ~/.terraformrc << EOF
          provider_installation {
            dev_overrides {
              "combor/ona" = "${{ github.workspace }}"
            }
            direct {}
          }
          EOF
      - name: Clean up stale runners
        working-directory: examples/cleanup
        run: |
          terraform apply -auto-approve \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}"
          terraform destroy -auto-approve \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}"
      - name: Terraform Apply
        working-directory: examples
        run: |
          terraform apply -auto-approve \
            -var="runner_name=tf-ci-${{ github.run_id }}" \
            -var="runner_provider_type=RUNNER_PROVIDER_MANAGED" \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}" \
            -var="runner_region=eu-central-1" \
            -var="project_name=tf-ci-proj-${{ github.run_id }}"
      - name: Terraform Destroy
        if: always()
        working-directory: examples
        run: |
          terraform destroy -auto-approve \
            -var="runner_name=tf-ci-${{ github.run_id }}" \
            -var="runner_provider_type=RUNNER_PROVIDER_MANAGED" \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}" \
            -var="runner_region=eu-central-1" \
            -var="project_name=tf-ci-proj-${{ github.run_id }}"

  release:
    name: Release
    needs:
      - test
      - integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      # Feeds release.header in .goreleaser.yml. The variable is always set,
      # because GoReleaser errors on an undefined .Env reference; releases
      # without notes just get an empty header.
      - name: Load release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "RELEASE_HEADER<<__RELEASE_HEADER_EOF__"
            if [ -f "$notes" ]; then
              cat "$notes"
            fi
            echo "__RELEASE_HEADER_EOF__"
          } >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          RELEASE_HEADER: ${{ env.RELEASE_HEADER }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip,dist/*_SHA256SUMS,dist/*_SHA256SUMS.sig'
