# Terraform Provider CI workflow.
name: CI

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/actions.lock'
      - '.github/dependabot.yml'
      - '.goreleaser.yml'
      - 'examples/**'
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/actions.lock'
      - '.github/dependabot.yml'
      - '.goreleaser.yml'
      - 'examples/**'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          cache: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v -o terraform-provider-ona .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  integration:
    name: Integration Test (Terraform ${{ matrix.terraform }})
    needs:
      - build
      - govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      max-parallel: 1
      matrix:
        terraform:
          - '1.7.*'
          - '1.17.*'
    env:
      GITPOD_API_KEY: ${{ secrets.GITPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Build provider
        run: go build -o terraform-provider-ona .
      - name: Setup dev overrides
        run: |
          cat > ~/.terraformrc << EOF
          provider_installation {
            dev_overrides {
              "combor/ona" = "${{ github.workspace }}"
            }
            direct {}
          }
          EOF
      - name: Clean up stale runners
        working-directory: examples/cleanup
        run: |
          terraform apply -auto-approve \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}"
          terraform destroy -auto-approve \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}"
      - name: Terraform Apply
        working-directory: examples
        run: |
          terraform apply -auto-approve \
            -var="runner_name=tf-ci-${{ github.run_id }}" \
            -var="runner_provider_type=RUNNER_PROVIDER_MANAGED" \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}" \
            -var="runner_region=eu-central-1" \
            -var="project_name=tf-ci-proj-${{ github.run_id }}"
      - name: Terraform Destroy
        if: always()
        working-directory: examples
        run: |
          terraform destroy -auto-approve \
            -var="runner_name=tf-ci-${{ github.run_id }}" \
            -var="runner_provider_type=RUNNER_PROVIDER_MANAGED" \
            -var="runner_manager_id=${{ secrets.RUNNER_MANAGER_ID }}" \
            -var="runner_region=eu-central-1" \
            -var="project_name=tf-ci-proj-${{ github.run_id }}"

  lockfile:
    name: Verify Actions Lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails when .github/workflows/actions.lock is out of sync with the
      # workflows, or a locked pin no longer verifies upstream. After adding
      # a workflow or changing a `uses:` line, rerun `gh actions-lock`.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 1.32.0 is the first release that reads the lockfile.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: v1.32.0
          advanced-security: false

  release:
    name: Release
    needs:
      - test
      - integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
      # Feeds release.header in .goreleaser.yml. The variable is always set,
      # because GoReleaser errors on an undefined .Env reference; releases
      # without notes just get an empty header.
      - name: Load release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "RELEASE_HEADER<<__RELEASE_HEADER_EOF__"
            if [ -f "$notes" ]; then
              cat "$notes"
            fi
            echo "__RELEASE_HEADER_EOF__"
          } >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          RELEASE_HEADER: ${{ env.RELEASE_HEADER }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: 'dist/*.zip,dist/*_SHA256SUMS,dist/*_SHA256SUMS.sig'
